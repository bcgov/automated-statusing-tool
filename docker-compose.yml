x-shared-env: &shared-env
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DATABASE: ${REDIS_DATABASE:-0}
  REDIS_URL: valkey://:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/${REDIS_DATABASE:-0}
  API_PORT: ${API_PORT:-8000}
  S3_ENDPOINT: ${S3_ENDPOINT:-"http://seaweedfs:8333"}
  RESULTS_S3_ACCESS_ID: ${RESULTS_S3_ACCESS_ID}
  RESULTS_S3_KEY: ${RESULTS_S3_KEY}
  RESULTS_S3_BUCKET: ${RESULTS_S3_BUCKET}
  NO_PROXY: ${NO_PROXY}
  AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
  AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
  APP_VERSION: 'dev-local'

services:
  ast-engine:
    image: ast-engine:latest
    build:
      context: .
      dockerfile: ./ast_engine/Dockerfile
    container_name: ast-worker
    environment:
      <<: *shared-env
    env_file:
      - .env
    volumes:
      - data:/data/engine
    networks:
      - ast-net
  
  ast-api:
    image: ast-api:latest
    build:
      context: .
      dockerfile: ./ast_api/Dockerfile
    container_name: ast-api
    ports:
      - "8000:${BACKEND_PORT:-8000}"
    environment:
      <<: *shared-env
    env_file:
      - .env
    volumes:
      - data:/data/api
    networks:
      - ast-net
    command: uv run python -m uvicorn ast_api.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} --reload
  valkey:
    # Ephemeral cache only.
    # No persistent storage required.
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    command: > 
      valkey-server
      --port ${REDIS_PORT}
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD}

    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ast-net

  # Object Storage infrastructure
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: local-s3
    entrypoint: ""
    environment:
      <<: *shared-env
    command: > #server -s3 -s3.config=/etc/seaweedfs/s3.json
      sh -c "mkdir -p /etc/seaweedfs && printf '{
        \"identities\": [
          {
            \"name\": \"anonymous\",
            \"actions\": [\"Read\"]
          },
          {
            \"name\": \"some_admin_user\",
            \"credentials\": [
              {
                \"accessKey\": \"%s\",
                \"secretKey\": \"%s\"
              }
            ],
            \"actions\": [\"Admin\", \"Read\", \"List\", \"Tagging\", \"Write\"]
          }
        ]
      }' \"$$RESULTS_S3_ACCESS_ID\" \"$$RESULTS_S3_KEY\" > /etc/seaweedfs/s3.json && 
      weed server -s3 -s3.config=/etc/seaweedfs/s3.json"
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # Cluster Status
    volumes:
      - seaweedfs-data:/data
    #- ./s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - ast-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  seaweedfs-data:
  data:

networks:
  ast-net:
    driver: bridge
